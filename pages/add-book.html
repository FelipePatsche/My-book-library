<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>My Book Library - Add New Review</title>
</head>
<body>
    <ui>
        <span>This demo uses fictitious data, does not save reviews, does not add books or load covers, and the button does not suggest registration.</span>
    </ui>
    <header>
       <div>
            <a href="../index.html" >
                <img src="../assets/images/book.svg" alt="my library icon" height="32">
                <span>MLib</span>
            </a>
       </div>
    </header>
    <main>
         <div class="form-page-container">
    <h2>New Review</h2>

    <div class="form-container">
        <form>
            <div class="form-group">
                <label for="book-name">Book Name</label>
                <input type="text" id="book-name" placeholder="Enter the book title" required>
            </div>

            <div class="form-group">
                <label for="book-genre">Book Genre</label>
                <input type="text" id="book-name" placeholder="Enter the book genre">
            </div>

            <div class="form-group">
                <label for="book-author">Book Author</label>
                <input type="text" id="book-name" placeholder="Enter the book author">
            </div>
            
            <div class="form-group">
                <label for="poster-url">Poster URL</label>
                <input type="url" id="poster-url" placeholder="Paste image URL (jpg or png)">
            </div>
            <div class="form-row">
                

    <div class="form-group">
        <label for="watched-date">Readed Date</label>
        <input type="date" id="watched-date">
    </div>


    <div class="form-group">
        <label for="rating-select">Stars</label>
        <select id="rating-select" required>
            <option value="">Choose a rating</option>
            <option value="1">★☆☆☆☆ - 1 Star</option>
            <option value="2">★★☆☆☆ - 2 Stars</option>
            <option value="3">★★★☆☆ - 3 Stars</option>
            <option value="4">★★★★☆ - 4 Stars</option>
            <option value="5">★★★★★ - 5 Stars</option>
        </select>
    </div>
</div>
<div class="form-group">
    <label for="review-text">My Review</label>
    <textarea required id="review-text" rows="5" placeholder="Write your thoughts here..."></textarea>
</div>
<button type="submit" class="submit-button">Add</button>
        </form>
    </div>
</div>

    </main>
    
    <footer>
        <p>&copy; 2025 MLib &ndash; My book Library</p>
    </footer>

</body>
</html>
