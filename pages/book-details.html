<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>My Book Library &dash; Book Details</title>
</head>
<body>
    <header>
       <div>
            <a href="../index.html" >
                <img src="../assets/images/book.svg" alt="my library icon" height="32">
                <span>MLib</span>
            </a>
       </div>
       <nav>
        <a href="../pages/add-book.html">
        <button class="add-button" aria-label="Add new book review">+</button>
        </a>
       </nav>
    </header>
    <main>
         <div class="details-box">
            <img src="../assets/images/image.png" alt="O Homem que Calculava &dash; Malba Tahan">
            <div class="review-box">
            <h2>O Homem que Calculava</h2>
            <div class="review-texting">
                <h3>Readed on:</h3>
                <span class="date-on">12/14/2025</span>
            </div>

            <div class="review-texting">
                <h3>Author:
                </h3>
                <span>Malba Tahan</span>
            </div>

            <div class="review-texting">
                <h3>Rating:</h3>
                <div class="rating">
                    5/5
                </div>
            </div>

            <div class="review-texting">
                <h3>"Resenha"</h3>
                <p class="review-text-new">It tells about a very smart man that got notoriosly known.</p>
            </div>
            </div>
         </div>
         
    </main>
    <footer>
    <p>&copy; 2025 MLib &ndash; My book Library</p>
</footer>

</body>
</html>
